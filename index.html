<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA — Your intelligent AI companion</title>
<meta name="description" content="NOVA is an intelligent AI companion for writing, analysis, research and everyday tasks.">
<meta name="theme-color" content="#F8FAFC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232563EB'/%3E%3Cpath d='M16 7l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--sf:#fff;--tx:#0F172A;--t2:#64748B;--bd:#E2E8F0;--bl:#2563EB;--gr:#10B981;--pu:#8B5CF6;--blt:#2563EB;--grt:#047857;--put:#6D28D9;--tint:#EFF6FF;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;--s24:96px;--r:12px;--R:20px;--e:cubic-bezier(.2,.7,.2,1)}
[data-theme=dark]{--bg:#0B1120;--sf:#111A2E;--tx:#E2E8F0;--t2:#94A3B8;--bd:#223049;--blt:#60A5FA;--grt:#34D399;--put:#A78BFA;--tint:#16223C;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--blt);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(32px,5vw,48px);font-weight:700}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:700}
h3{font-size:18px;font-weight:600}
.sub{color:var(--t2);font-size:18px}
small,.cap{font-size:13.5px;color:var(--t2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--s6)}
.sec{padding:var(--s24) 0}
.page{animation:pg .35s var(--e)}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s6);border-radius:var(--r);background:var(--bl);color:#fff;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 1px 2px rgba(37,99,235,.3)}
.btn:hover{background:#1D4ED8;box-shadow:0 6px 16px rgba(37,99,235,.28);transform:translateY(-1px)}
.btn:active{transform:scale(.98);box-shadow:none}
.btn:disabled,.btn[aria-busy=true]{opacity:.55;pointer-events:none}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.o:hover{border-color:var(--blt);background:var(--tint)}
.btn.d{background:#4F46E5}
.btn.sm{min-height:36px;padding:0 var(--s4);font-size:14px}
.btn.full{width:100%}
.lnk{color:var(--blt);font-weight:600;min-height:44px;padding:0 var(--s3);border-radius:8px}
.lnk:hover{text-decoration:underline}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r);color:var(--t2);transition:background .15s,color .15s,transform .15s;flex:none}
.ibtn:hover{background:var(--tint);color:var(--blt)}
.ibtn:active{transform:scale(.94)}
.ibtn.sm{width:32px;height:32px}
/* header */
.hd{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--s8);height:72px;padding:0 max(var(--s6),calc((100vw - 1120px)/2));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top)}
.logo{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:20px;letter-spacing:.04em}
.nv{display:flex;gap:var(--s2);margin-right:auto}
.nv>a,.nv .dd>button{padding:var(--s2) var(--s4);border-radius:10px;color:var(--t2);font-weight:500;font-size:15px;min-height:40px;display:inline-flex;align-items:center;gap:4px;transition:color .15s,background .15s}
.nv>a:hover,.nv .dd>button:hover,.nv [aria-current]{color:var(--tx);background:var(--tint)}
.hr{display:flex;align-items:center;gap:var(--s2)}
.burger{display:none}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:var(--s2);opacity:0;visibility:hidden;transform:translateY(-4px);transition:.2s var(--e);z-index:50}
.ddm.r{left:auto;right:0}
.dd.open .ddm{opacity:1;visibility:visible;transform:none}
.ddm a,.ddm button{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;padding:10px var(--s3);border-radius:8px;font-size:15px;min-height:40px}
.ddm a:hover,.ddm button:hover{background:var(--tint)}
/* drawer + bottom nav */
.scrim,.scr{position:fixed;inset:0;background:rgba(15,23,42,.4);opacity:0;visibility:hidden;transition:.3s;z-index:55}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--sf);z-index:60;padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2);transform:translateX(102%);visibility:hidden;transition:transform .3s var(--e),visibility .3s;box-shadow:var(--sh)}
body.dr #drawer{transform:none;visibility:visible}
body.dr .scrim{opacity:1;visibility:visible}
#drawer a{padding:var(--s3) var(--s4);border-radius:var(--r);font-weight:500;font-size:17px;display:flex;gap:var(--s3);align-items:center}
#drawer a:hover,#drawer [aria-current]{background:var(--tint);color:var(--blt)}
.bn{display:none}
/* avatar */
.avatar{--c1:#2563EB;--c2:#93C5FD;position:relative;width:var(--z,200px);aspect-ratio:1;flex:none;display:grid;place-items:center}
.avatar .halo{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(closest-side,rgba(37,99,235,.17),rgba(139,92,246,.11) 55%,rgba(16,185,129,.05) 68%,transparent 74%);animation:br 5s ease-in-out infinite;pointer-events:none}
.avatar .ring{position:absolute;inset:-7%;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));opacity:.5;animation:rp 4s ease-in-out infinite;transition:opacity .3s}
.avatar .wave{position:absolute;inset:-7%;border-radius:50%;border:2px solid var(--gr);opacity:0}
.avatar .orb{position:relative;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#3B82F6,#2563EB 55%,#8B5CF6);box-shadow:0 14px 36px rgba(37,99,235,.26),inset 0 2px 0 rgba(255,255,255,.35);animation:br 5s ease-in-out infinite}
.orb svg{width:100%;height:100%;display:block}
.eye{transform-box:fill-box;transform-origin:center;animation:bk 5s infinite}
@keyframes br{50%{transform:scale(1.03)}}
@keyframes rp{50%{opacity:.85}}
@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes wv{from{transform:scale(1);opacity:.7}to{transform:scale(1.28);opacity:0}}
.avatar[data-state=listening]{--c1:#10B981;--c2:#6EE7B7}
.avatar[data-state=listening] .ring{opacity:.9}
.avatar[data-state=listening] .wave{animation:wv 1.4s ease-out infinite}
.avatar[data-state=listening] .wave+.wave{animation-delay:.7s}
.avatar[data-state=thinking]{--c1:#8B5CF6;--c2:rgba(139,92,246,.08)}
.avatar[data-state=thinking] .ring{opacity:1;animation:sp 1.4s linear infinite}
.avatar[data-state=responding]{--c1:#2563EB;--c2:#10B981}
.avatar[data-state=responding] .ring{opacity:1;animation:sp 3.5s linear infinite}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--t2);font-weight:500}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.mav{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#3B82F6,#8B5CF6);flex:none;margin-top:4px}
/* hero */
.hero{min-height:calc(100dvh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s8) var(--s6) var(--s12);gap:var(--s4)}
.hero .av{margin:var(--s6) 0 var(--s4)}
.hero .hn{display:flex;gap:var(--s3);align-items:center;font-weight:600;color:var(--tx)}
.hero .tg{color:var(--t2);margin-top:calc(var(--s2)*-1)}
.chat{width:100%;max-width:680px;display:flex;flex-direction:column;text-align:left}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);max-width:680px;margin-top:var(--s2)}
.chip{min-height:40px;padding:0 var(--s4);border:1px solid var(--bd);border-radius:999px;background:var(--sf);font-size:14.5px;font-weight:500;color:var(--tx);transition:.18s var(--e);white-space:nowrap}
.chip:hover{border-color:var(--blt);color:var(--blt);transform:translateY(-1px);background:var(--tint)}
.chip:active{transform:scale(.97)}
.inp{display:flex;align-items:flex-end;gap:var(--s1);background:var(--sf);border:1px solid var(--bd);border-radius:var(--R);padding:var(--s2);box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--bl);box-shadow:0 0 0 4px rgba(37,99,235,.14),var(--sh)}
.inp textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;padding:10px var(--s2);max-height:140px;line-height:1.5}
.inp textarea::placeholder{color:var(--t2)}
.send{width:44px;height:44px;border-radius:var(--r);background:var(--bl);color:#fff;display:grid;place-items:center;flex:none;transition:.15s}
.send:hover{background:#1D4ED8}.send:active{transform:scale(.94)}
.send:disabled{background:var(--bd);color:var(--t2);cursor:not-allowed}
.msgs{display:flex;flex-direction:column;gap:var(--s4);overflow-y:auto;scroll-behavior:smooth}
.row{display:flex;gap:var(--s3);width:100%}
.row:last-child{animation:fi .3s var(--e)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.row.u{justify-content:flex-end}
.bub{padding:var(--s3) var(--s4);border-radius:var(--R);max-width:100%;overflow-wrap:anywhere}
.bub.u{background:var(--bl);color:#fff;border-bottom-right-radius:6px;max-width:85%;white-space:pre-wrap}
.bub.a,.bub.ty,.bub.err{background:var(--sf);border:1px solid var(--bd);border-top-left-radius:6px}
.bub.a p+p,.bub.a ol{margin-top:var(--s2)}.bub.a ol{padding-left:var(--s6)}.bub.a li{margin-top:var(--s1)}
.bub.err{border-color:#A78BFA;display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
.bw{min-width:0;max-width:calc(100% - 40px)}
.acts2{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
.ab{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s3);border-radius:8px;font-size:13.5px;color:var(--t2);transition:.15s}
.ab:hover{background:var(--tint);color:var(--blt)}
.ab[aria-pressed=true]{background:var(--tint);color:var(--blt);font-weight:600}
.fchip{display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 8px;margin-bottom:var(--s2);width:max-content;max-width:100%}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--pu);animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bd),var(--tint),var(--bd));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.hero .msgs{max-height:300px;margin-bottom:var(--s4);padding-right:4px}
.voice,.att{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:var(--r);background:var(--tint);font-size:14.5px}
.att{justify-content:space-between}
.wf{display:flex;align-items:center;gap:3px;height:24px}
.wf i{width:3px;height:6px;border-radius:2px;background:var(--gr);animation:wf .9s ease-in-out infinite}
.wf i:nth-child(2n){animation-delay:.2s}.wf i:nth-child(3n){animation-delay:.4s}
@keyframes wf{50%{height:22px}}
.voice b{margin-right:auto}
/* sections */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s6);margin-top:var(--s12);counter-reset:s}
.step{padding-top:var(--s6);border-top:2px solid var(--bd);position:relative}
.step::before{counter-increment:s;content:"0" counter(s);font-weight:700;font-size:15px;color:var(--blt);display:block;margin-bottom:var(--s3)}
.step:nth-child(2){border-color:var(--pu)}.step:nth-child(3){border-color:var(--gr)}.step:nth-child(1){border-color:var(--bl)}.step:nth-child(4){border-color:var(--blt)}
.step p{color:var(--t2);margin-top:var(--s2)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s var(--e),transform .5s var(--e)}
.rv.in{opacity:1;transform:none}
.cta{text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:28px;padding:var(--s16) var(--s6);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-top:var(--s12)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--R);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s3);transition:.25s var(--e)}
.card:hover{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--bl) 40%,var(--bd))}
.card p{color:var(--t2);font-size:15px;flex:1}
.fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--blt)}
.card:nth-child(3n+2) .fi{background:rgba(16,185,129,.12);color:var(--grt)}.card:nth-child(3n) .fi{background:rgba(139,92,246,.12);color:var(--put)}
.demo{display:flex;flex-direction:column;align-items:center;gap:var(--s4);margin-top:var(--s12);padding:var(--s12) var(--s6);background:var(--sf);border:1px solid var(--bd);border-radius:28px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s1);gap:var(--s1);flex-wrap:wrap;justify-content:center}
.seg button{min-height:40px;padding:0 var(--s4);border-radius:9px;font-weight:500;font-size:14.5px;color:var(--t2);transition:.15s}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--tx);box-shadow:var(--sh);font-weight:600}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s6);margin-top:var(--s8);align-items:stretch}
.plan{background:var(--sf);border:1px solid var(--bd);border-radius:var(--R);padding:var(--s8);display:flex;flex-direction:column;gap:var(--s4)}
.plan.pop{border:2px solid var(--bl);box-shadow:var(--sh)}
.price{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}.price small{font-size:16px;font-weight:500}
.badge{align-self:flex-start;background:var(--tint);color:var(--blt);border-radius:999px;padding:2px var(--s3);font-size:13px;font-weight:600}
.plan ul{list-style:none;padding:0;display:grid;gap:var(--s3);flex:1;color:var(--t2);font-size:15px}
.plan li{display:flex;gap:var(--s2)}.plan li svg{color:var(--grt);flex:none;margin-top:3px}
.tw{overflow-x:auto;margin-top:var(--s12);border:1px solid var(--bd);border-radius:var(--R);background:var(--sf)}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:15px}
th,td{padding:var(--s4) var(--s6);text-align:left;border-bottom:1px solid var(--bd)}
th{font-weight:600}td{color:var(--t2)}tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s12);align-items:start;margin-top:var(--s12)}
.fld{display:grid;gap:6px;margin-bottom:var(--s4)}
.fld label{font-weight:600;font-size:14.5px}
.fld input,.fld textarea,.fld select{width:100%;min-height:48px;padding:var(--s3) var(--s4);border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);transition:.2s}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.fld [aria-invalid=true]{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.er{color:var(--put);font-size:13.5px;font-weight:500;min-height:0}
.ok{text-align:center;padding:var(--s12) var(--s6);background:var(--sf);border:1px solid var(--bd);border-radius:var(--R);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.ck{width:56px;height:56px;border-radius:50%;background:rgba(16,185,129,.14);color:var(--grt);display:grid;place-items:center}
.banner{padding:var(--s3) var(--s4);border-radius:var(--r);background:rgba(139,92,246,.12);color:var(--put);font-weight:500;margin-bottom:var(--s4)}
details{border-bottom:1px solid var(--bd);padding:var(--s4) 0}
summary{cursor:pointer;font-weight:600;min-height:28px;list-style:none;display:flex;justify-content:space-between;gap:var(--s4)}
summary::after{content:"+";color:var(--t2);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--t2);margin-top:var(--s2)}
.ab-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s6);padding:var(--s16) 0 var(--s8)}
.stl{display:grid;grid-template-columns:240px 1fr;gap:var(--s12);margin-top:var(--s12);align-items:start}
.tabs{display:flex;flex-direction:column;gap:var(--s1)}
.tabs button{display:flex;gap:var(--s3);align-items:center;min-height:44px;padding:0 var(--s4);border-radius:var(--r);color:var(--t2);font-weight:500;text-align:left;transition:.15s}
.tabs button:hover{background:var(--tint)}.tabs button[aria-selected=true]{background:var(--sf);color:var(--tx);box-shadow:var(--sh);font-weight:600}
.pnl{background:var(--sf);border:1px solid var(--bd);border-radius:var(--R);padding:var(--s8);animation:pg .3s var(--e)}
.pnl h3{margin-bottom:var(--s4)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--bd);cursor:pointer}
.tg span{display:grid;font-weight:500}.tg small{font-weight:400}
.tg input{position:absolute;opacity:0;width:44px;height:28px}
.tg i{position:relative;width:48px;height:28px;border-radius:999px;background:var(--bd);flex:none;transition:.2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s var(--e)}
.tg input:checked+i{background:var(--bl)}.tg input:checked+i::after{transform:translateX(20px)}
.tg input:focus-visible+i{outline:3px solid var(--blt);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.opt{border:2px solid var(--bd);border-radius:var(--r);padding:var(--s3);cursor:pointer;display:grid;gap:var(--s2);font-weight:500;font-size:14.5px;transition:.15s}
.opt input{position:absolute;opacity:0}.opt:has(input:checked){border-color:var(--bl)}.opt:has(input:focus-visible){outline:3px solid var(--blt);outline-offset:2px}
.pv{height:64px;border-radius:8px;border:1px solid var(--bd);background:linear-gradient(90deg,#F8FAFC 50%,#F8FAFC 50%);position:relative}
.pv::after{content:"";position:absolute;left:10px;top:10px;width:40%;height:8px;border-radius:4px;background:#2563EB}

/* ---------- data ---------- */
const RESP={
plan:["Absolutely. Here's a simple 5-step marketing plan:\n1. Define your audience — pick one segment and list their top three problems.\n2. Sharpen your message — one sentence on what changes for them after using your product.\n3. Choose two channels — for example search and a newsletter — and do them well.\n4. Run a 30-day experiment — publish weekly and track sign-ups per channel.\n5. Review and double down — keep what converts, cut the rest.\nWant me to turn this into a weekly calendar?","Here's a lean way to approach it:\n1. Write down who you help and the one outcome they care about.\n2. Turn that into a headline and a three-line pitch.\n3. Pick one channel where your audience already gathers.\n4. Ship small tests every week and measure replies, not likes.\n5. Reinvest in whatever brings paying customers.\nShall I draft the first week's posts?"],
data:["Happy to help. Start by sharing the numbers, then I'll work through it like this:\n1. Check the data for gaps and outliers.\n2. Compare against the previous period.\n3. Segment by customer, product or region to find where the change comes from.\n4. Summarise the finding in two sentences.\nYou can paste a table or attach a file and I'll begin.","Let's break it down:\n1. What decision will this analysis support?\n2. Which metric best reflects it?\n3. What changed, and when?\nOnce you attach the data I'll highlight the three findings that matter most."],
email:["Here's a draft you can adjust:\nSubject: Quick check-in on the project\nHi Sam,\nI hope your week is going well. I'd like to catch up on where the project stands and whether anything is blocking you. Could we find 15 minutes on Thursday?\nThanks,\nAlex\nWant it warmer, shorter or more formal?","Another option, more concise:\nSubject: Project update?\nHi Sam, could you share a short update by Friday? If anything is blocked, tell me and I'll help clear it.\nThanks, Alex"],
ideas:["Here are five ideas to start with:\n1. A weekly digest that answers one customer question.\n2. A behind-the-scenes series showing how the product is made.\n3. A free template people can use in five minutes.\n4. A short customer story with one clear result.\n5. A monthly Q&A session you record and share.\nTell me which one fits and I'll expand it.","Try these directions:\n1. Solve a small, annoying problem for your audience.\n2. Turn a common mistake into a how-to guide.\n3. Compare two popular options honestly.\n4. Share one lesson from your last month.\nWant names, outlines or both?"],
explain:["Here's the short version: start from the core idea, then add detail only where it helps you decide or act.\n1. What it is, in one sentence.\n2. Why it matters to you.\n3. A simple example.\n4. The common mistake to avoid.\nTell me the topic and I'll walk you through it at your level.","Think of it as a system with inputs, a rule and an output. Name those three parts and the rest usually falls into place. Which topic would you like me to apply this to?"],

const upd=r=>{const t=$('textarea',r);t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';$('.send',r).disabled=!t.value.trim()&&!att};
const empty=()=>`<div class="empty">${av(132)}<h2>${greet()}.<br>What would you like to explore?</h2><div class="acts">${[['Create','pen','Create a marketing plan for my startup.'],['Analyze','bar','Analyze my data: sales dropped 8% in March.'],['Write','file','Write an email asking for a project update.'],['Explore','bulb','Generate ideas for a newsletter name.']].map(a=>`<button data-act="prompt" data-v="${a[2]}">${ic(a[1],22)}${a[0]}</button>`).join('')}</div></div>`;
function msgH(m,i,last){
 if(m.r==='u')return `<div class="row u"><div class="bub u">${m.f?`<span class="fchip">${ic('file',14)}${esc(m.f)}</span>`:''}${esc(m.t)}</div></div>`;
 if(m.r==='e')return `<div class="row"><div class="mav"></div><div class="bub err" role="alert"><span>${esc(m.t)}</span><button class="btn sm" data-act="retry">${ic('refresh',16)}Try again</button></div></div>`;
 return `<div class="row"><div class="mav"></div><div class="bw"><div class="bub a">${fmt(m.t)}</div><div class="acts2"><button class="ab" data-act="copy" data-i="${i}">${ic('copy',16)}Copy</button>${last?`<button class="ab" data-act="regen">${ic('refresh',16)}Regenerate</button>`:''}<button class="ab" data-act="fb" data-v="up" data-i="${i}" aria-pressed="${m.fb==='up'}">${ic('up',16)}Helpful</button><button class="ab" data-act="fb" data-v="down" data-i="${i}" aria-pressed="${m.fb==='down'}">${ic('down',16)}Not helpful</button></div></div></div>`}
function draw(c,think){const r=root(c);if(!r)return;const M=msgs(c),b=$('.msgs',r);let h=M.map((m,i)=>msgH(m,i,i===M.length-1)).join('');
 if(think)h+=`<div class="row"><div class="mav"></div><div class="bub ty" role="status">NOVA is thinking...<span class="dots"><i></i><i></i><i></i></span></div></div>`;
 if(c==='ws'&&!M.length&&!think)h=empty();b.innerHTML=h;
 if(c==='hero'){b.hidden=!M.length&&!think;$('.cont')&&($('.cont').hidden=!M.length)}
 setState($('.avatar')?.dataset.state||'idle');b.scrollTop=b.scrollHeight}
function send(c,txt){const r=root(c);if(!r||busy)return;const inp=$('textarea',r);txt=(txt??inp.value).trim();if(!txt&&!att)return;
 const M=msgs(c);M.push({r:'u',t:txt||'Please summarize the attached file.',f:att});att=null;$('.att',r).hidden=true;inp.value='';upd(r);
 if(c==='ws'&&cur().title==='New chat'&&txt)cur().title=txt.length>30?txt.slice(0,30)+'…':txt;
 save();ws_list();respond(c,M,txt)}
function respond(c,M,txt){busy=true;setState('thinking');draw(c,true);
 setTimeout(()=>{busy=false;if(/\/error/i.test(txt))M.push({r:'e',t:"Hmm, I couldn't complete that request.",q:txt.replace(/\/error/ig,'').trim()||'Try again'});
 else{const k=pick(txt);M.push({r:'a',k,v:0,t:RESP[k][0]})}
 save();draw(c);if(M.at(-1).r==='a'){setState('responding');setTimeout(()=>{if(!busy)setState('idle')},1800)}else setState('idle')},1300)}
function copyTxt(t){return navigator.clipboard?.writeText(t).catch(()=>fb(t))||fb(t)}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

/* voice (simulated) */
const TR=["Create a marketing plan for my startup.","Write an email asking for a project update.","Generate ideas for a newsletter name."];
function mic(c){const r=root(c),v=$('.voice',r);if(!v.hidden)return mcancel(r);if(busy)return;v.hidden=false;setState('listening');vt=setTimeout(()=>mstop(r),4500)}
function mcancel(r){clearTimeout(vt);$('.voice',r).hidden=true;setState('idle')}
function mstop(r){if($('.voice',r).hidden)return;clearTimeout(vt);$('.voice',r).hidden=true;setState('idle');const t=$('textarea',r);t.value=TR[Math.floor(Math.random()*TR.length)];upd(r);t.focus();toast('Voice captured. Press send.')}

 case'prompt':{if(c==='ws'||!c&&root('hero')||c){}const r=root('hero')||root('ws');const t=$('textarea',r);t.value=b.dataset.v;upd(r);t.focus();break}
 case'mic':mic(c);break;case'mstop':mstop(b.closest('.chat'));break;case'mcancel':mcancel(b.closest('.chat'));break;
 case'attach':$('input[type=file]',b.closest('.chat')).click();break;
 case'rmatt':att=null;$('.att',b.closest('.chat')).hidden=true;upd(b.closest('.chat'));break;
 case'copy':copyTxt(msgs(c)[b.dataset.i].t);b.innerHTML=ic('check',16)+'Copied';toast('Copied to clipboard');setTimeout(()=>b.innerHTML=ic('copy',16)+'Copy',1600);break;
 case'regen':{if(busy)break;const M=msgs(c),m=M.pop();m.v=(m.v+1)%2;m.t=RESP[m.k][m.v];m.fb=null;busy=true;setState('thinking');draw(c,true);setTimeout(()=>{busy=false;M.push(m);save();draw(c);setState('responding');setTimeout(()=>setState('idle'),1600)},1100);break}
 case'fb':{const m=msgs(c)[b.dataset.i];m.fb=m.fb===b.dataset.v?null:b.dataset.v;save();$$('[data-act=fb]',b.parentNode).forEach(x=>x.setAttribute('aria-pressed',m.fb===x.dataset.v));if(m.fb)toast('Thanks for the feedback');break}
 case'retry':{const M=msgs(c),m=M.pop();respond(c,M,m.q);break}
 case'cont':{const t=heroM.find(m=>m.r==='u').t;S.chats.unshift({id:Date.now(),title:t.length>30?t.slice(0,30)+'…':t,msgs:heroM.map(m=>({...m}))});S.cur=S.chats[0].id;heroM=[];save();location.hash='#/chat';break}
 case'new':newChat();ws_list();draw('ws');closeAll();$('textarea',root('ws')).focus();break;
 case'open':wsOpen(+b.dataset.id);break;
 case'ren':closeAll();renameM(b.dataset.id==='cur'?S.cur:b.dataset.id);break;
 case'del':closeAll();delM(b.dataset.id==='cur'?S.cur:b.dataset.id);break;
 case'clear':closeAll();modal('Clear conversation?',`<p>All messages in this conversation will be removed.</p>`,[{l:'Cancel',c:'o'},{l:'Clear',c:'d',f:()=>{cur().msgs=[];save();draw('ws');toast('Conversation cleared')}}]);break;
 case'try':{const p=FEAT[b.dataset.i][3];S.pending=p;location.hash='#/chat';break}
 case'st':clearInterval(tm);demoSt(b.dataset.s);break;
 case'bill':{const y=b.dataset.b==='y';$$('[data-act=bill]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#pp').textContent=y?'$15':'$19';$('#pn').textContent=y?'Billed $180 yearly':'Billed monthly';break}
 case'plan':{const p=b.dataset.p;if(p==='Free'){location.hash='#/chat';toast('Welcome to NOVA Free')}else if(p==='Pro')modal('Start your Pro trial',`<p>14 days free, then ${$('#pp').textContent}/month. Cancel any time.</p><div class="fld" style="margin-top:16px"><label for="te">Email</label><input id="te" type="email" value="${esc(S.set.email)}"></div>`,[{l:'Cancel',c:'o'},{l:'Start trial',f:m=>{if(!/^\S+@\S+\.\S+$/.test($('#te',m).value)){$('#te',m).setAttribute('aria-invalid','true');return false}toast('Pro trial started. Check your inbox.')}}]);else{S.msgPre='I would like to learn about the Business plan for my team.';location.hash='#/contact'}break}
 case'tab':stab=+b.dataset.i;$$('[role=tab]').forEach((t,i)=>t.setAttribute('aria-selected',i===stab));$('#pnl').innerHTML=panel();break;
 case'prof':{const n=$('#pn1').value.trim(),m=$('#pe1').value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(m)){$('#pe1e').textContent='Enter a name and a valid email address.';break}S.set.name=n;S.set.email=m;save();$('#pe1e').textContent='';toast('Profile saved');break}
 case'exp':{const u=URL.createObjectURL(new Blob([JSON.stringify({settings:S.set,chats:S.chats},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='nova-data.json';a.click();URL.revokeObjectURL(u);toast('Data exported');break}
 case'wipe':modal('Delete all chats?',`<p>Every conversation will be permanently deleted.</p>`,[{l:'Cancel',c:'o'},{l:'Delete all',c:'d',f:()=>{S.chats=[{id:Date.now(),title:'New chat',msgs:[]}];S.cur=S.chats[0].id;save();toast('All chats deleted')}}]);break;
 case'pw':modal('Change password',`<div class="fld"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password"></div><div class="fld"><label for="p2">Confirm password</label><input id="p2" type="password" autocomplete="new-password"></div><p class="er" id="px" role="alert"></p>`,[{l:'Cancel',c:'o'},{l:'Update password',f:m=>{const a=$('#p1',m).value,c=$('#p2',m).value;if(a.length<8){$('#px',m).textContent='Use at least 8 characters.';return false}if(a!==c){$('#px',m).textContent='Passwords don’t match.';return false}toast('Password updated')}}]);break;
 case'out':toast('Signed out of other devices');break}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('.chat textarea'))upd(t.closest('.chat'));if(t.id==='q')ws_list();if(t.id==='vp')$('#vo').textContent=t.value+'×';if(t.hasAttribute('aria-invalid'))t.removeAttribute('aria-invalid')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches('.chat textarea')){e.preventDefault();send(e.target.closest('.chat').dataset.ctx)}
 if(e.key==='Escape'){closeM();closeAll()}
 if(e.key==='Tab'&&!$('#modal').hidden){const f=$$('input,select,button',$('#modal'));if(!f.length)return;const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(t.type==='file'){const f=t.files[0];if(f){att=f.name;const r=t.closest('.chat'),a=$('.att',r);a.innerHTML=`<span>${ic('file',16)} ${esc(f.name)}</span><button class="ibtn sm" data-act="rmatt" aria-label="Remove attachment">${ic('x',16)}</button>`;a.hidden=false;upd(r);toast('File attached');t.value=''}return}
 if(!k)return;S.set[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;save();if(k==='theme'||k==='motion')applyTheme();toast('Setting saved')});
document.addEventListener('submit',e=>{if(e.target.id!=='cform')return;e.preventDefault();const v=id=>$('#c-'+id).value.trim(),E={};
 if(v('name').length<2)E.name='Enter your name.';if(!/^\S+@\S+\.\S+$/.test(v('email')))E.email='Enter a valid email address, like name@example.com.';if(v('message').length<10)E.message='Write at least 10 characters so we can help.';
 ['name','email','message'].forEach(f=>{$('#e-'+f).textContent=E[f]||'';$('#c-'+f).setAttribute('aria-invalid',!!E[f])});
 if(Object.keys(E).length){$('#c-'+Object.keys(E)[0]).focus();return}
 const btn=$('#cs');btn.setAttribute('aria-busy','true');btn.textContent='Sending...';
 setTimeout(()=>{if(!navigator.onLine){btn.removeAttribute('aria-busy');btn.textContent='Send message';$('#cb').innerHTML='<div class="banner" role="alert">Your message wasn’t sent. Check your connection and try again.</div>';return}
  $('#cf').innerHTML=`<div class="ok" role="status"><div class="ck">${ic('check',28)}</div><h3>Message sent</h3><p class="sub" style="font-size:16px">Thanks, ${esc(v('name'))}. We’ll reply to ${esc(v('email'))} within one business day.</p><a class="btn o" href="#/contact" onclick="route();return false">Send another</a></div>`;toast('Message sent')},900)});
document.addEventListener('click',e=>{if(e.target.id==='modal')closeM();if(!e.target.closest('.dd'))$$('.dd.open').forEach(d=>d.classList.remove('open'));if(e.target.closest('#drawer a'))document.body.classList.remove('dr')});
addEventListener('hashchange',route);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
applyTheme();chrome();route();
</script>
</body>
